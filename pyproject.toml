[tool.poetry]
name = "release-volume-sampler"
version = "0.1.0"
description = "Module designed to sample potential submarine release volumes triggered by earthquakes."
authors = ["Erlend Briseid Storrøsten <erlend.briseid.storrosten@ngi.no>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
rasterio = "^1.3.10"
ipykernel = "^6.29.5"
pandas = "^2.2.2"
scikit-learn = "^1.5.1"
matplotlib = "^3.9.2"
pyproj = "^3.6.1"
tensorflow = "^2.18.0"
plotly = "^5.24.1"
ipython = "^8.29.0"
meshio = "^5.3.5"
shapely = "^2.0.6"
cartopy = "^0.24.1"


[tool.poetry.group.dev.dependencies]
nbformat = "^5.10.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
